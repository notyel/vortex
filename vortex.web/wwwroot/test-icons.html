<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Material Icons</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .material-icons {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 48px;
            display: inline-block;
        }
        body {
            padding: 40px;
            font-family: Arial, sans-serif;
        }
        .icon-test {
            margin: 20px;
            display: inline-block;
            text-align: center;
        }
        .icon-test span {
            display: block;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Prueba de Material Icons</h1>
    
    <div class="icon-test">
        <span class="material-icons">bolt</span>
        <span>bolt</span>
    </div>
    
    <div class="icon-test">

        <span>search</span>
    </div>
    
    <div class="icon-test">

    </div>
    
    <div class="icon-test">

        <span>ev_station</span>
    </div>
    
    <div class="icon-test">
        <span class="material-icons">vpn_key</span>
        <span>vpn_key</span>
    </div>
    
    <div class="icon-test">
        <span class="material-icons">groups</span>

    </div>
    
    <div class="icon-test">

    </div>
    
    <div class="icon-test">
        <span class="material-icons">lightbulb</span>
        <span>lightbulb</span>
    </div>
</body>
</html>
